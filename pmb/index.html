<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>PMB UMRI — Brief Kreatif Tim Produksi</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #08080a;
  --bg-surface: #0e0e13;
  --bg-card: rgba(18, 18, 24, 0.88);
  --bg-card-hover: rgba(25, 25, 34, 0.95);
  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.14);

  --text-main: #f5f5f7;
  --text-muted: #8e8ea2;
  --text-dim: #545468;

  --accent-yellow: #fbb03b;
  --accent-gold: #fbb03b;
  --accent-green: #0d7c2f;
  --accent-cyan: #00d2ff;
  --accent-red: #ff5252;

  --grad-signature: linear-gradient(135deg, #0d7c2f 0%, #fbb03b 100%);
  --grad-card-header: linear-gradient(180deg, rgba(251, 176, 59, 0.08) 0%, transparent 100%);
  --font-display: 'Funnel Display', sans-serif;
  --font-body: 'Plus Jakarta Sans', sans-serif;
  --font-mono: 'Plus Jakarta Sans', sans-serif;
}

*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
}

html, body {
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden !important;
  background-color: var(--bg-deep);
  color: var(--text-main);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: 
    linear-gradient(to right, rgba(255,255,255,0.012) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.012) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
  z-index: 0;
}

.container {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 16px;
  position: relative;
  z-index: 1;
}

/* ==========================================================================
   SECURITY VERIFICATION GATE
   ========================================================================== */
#security-gate {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: radial-gradient(circle at center, #14141d 0%, #060608 100%);
  z-index: 999999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  transition: opacity 0.35s ease, visibility 0.35s ease;
}
#security-gate.unlocked {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.gate-card {
  background: rgba(15, 15, 21, 0.92);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid var(--border-subtle);
  box-shadow: 0 28px 80px rgba(0,0,0,0.9);
  border-radius: 20px;
  max-width: 400px;
  width: 100%;
  padding: 38px 28px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.gate-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--grad-signature);
}
.gate-brand-badge {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--accent-yellow);
  margin-bottom: 12px;
  text-transform: uppercase;
  font-weight: 700;
}
.gate-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 6px;
  color: #fff;
}
.gate-sub {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 24px;
  letter-spacing: 0.3px;
  line-height: 1.5;
}
.gate-input-wrap { margin-bottom: 14px; }
.gate-input {
  width: 100%;
  background: rgba(7, 7, 10, 0.85);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  color: #fff;
  font-family: var(--font-mono);
  font-size: 17px;
  text-align: center;
  letter-spacing: 2px;
  padding: 13px 14px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.gate-input:focus {
  border-color: var(--accent-yellow);
  box-shadow: 0 0 16px rgba(251, 176, 59, 0.22);
}
.gate-btn {
  width: 100%;
  background: var(--grad-signature);
  color: #050508;
  font-weight: 800;
  font-size: 13.5px;
  border: none;
  padding: 13px;
  border-radius: 8px;
  cursor: pointer;
  font-family: var(--font-display);
  letter-spacing: 0.3px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
}
.gate-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(251, 176, 59, 0.28);
}
.gate-error {
  display: none;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: #ff5252;
  margin-top: 10px;
}

/* ==========================================================================
   TOP BAR (STICKY HEADER)
   ========================================================================== */
.top-bar {
  border-bottom: 1px solid var(--border-subtle);
  background: rgba(14, 14, 19, 0.95);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 12px 0;
  position: sticky;
  top: 0;
  z-index: 100;
}
.top-bar-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brand-identity-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-logo-wrap {
  display: flex;
  align-items: center;
}
.header-logo-img {
  height: 24px;
  width: auto;
  max-width: 135px;
  display: block;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  transition: transform 0.2s ease;
}
.header-logo-img:hover {
  transform: scale(1.02);
}
.gate-brand-logo {
  width: 220px;
  max-width: 80%;
  margin: 0 auto 18px auto;
  display: flex;
  align-items: center;
  justify-content: center;
}
.gate-logo-img {
  width: 100%;
  height: auto;
  display: block;
  filter: drop-shadow(0 4px 18px rgba(0,0,0,0.7));
}
@media (max-width: 480px) {
  .header-logo-img {
    height: 20px;
    max-width: 105px;
  }
  .gate-brand-logo {
    width: 175px;
  }
}
.divider-col {
  width: 1px; height: 18px; background: var(--border-strong);
}
.partner-tag {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
}
.partner-tag strong { color: #fff; }
.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.back-btn {
  display: none;
  align-items: center;
  gap: 6px;
  background: rgba(251, 176, 59, 0.12);
  border: 1px solid var(--accent-yellow);
  color: var(--accent-yellow);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 12.5px;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.back-btn:hover {
  background: var(--accent-yellow);
  color: #050508;
  transform: translateY(-1px);
}
.editor-btn-top {
  background: rgba(251, 176, 59, 0.08);
  border: 1px solid rgba(251, 176, 59, 0.28);
  color: var(--accent-yellow);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 12px;
  padding: 8px 14px;
  border-radius: 8px;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
}
.editor-btn-top:hover {
  background: var(--accent-yellow);
  color: #050508;
  transform: translateY(-1px);
}
.lock-btn {
  background: transparent;
  border: 1px solid var(--border-subtle);
  color: var(--text-muted);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 12px;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
}
.lock-btn:hover {
  color: #fff;
  border-color: rgba(255, 255, 255, 0.25);
  transform: translateY(-1px);
}

.workspace-doc-view {
  display: none;
  animation: docIn 0.25s ease-out;
}
.workspace-doc-view.active {
  display: block;
}
@keyframes docIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ==========================================================================
   DIREKTORI HUB (HALAMAN UTAMA: KARTU BRIEF ANTREAN)
   ========================================================================== */
.hub-hero {
  margin: 36px 0 32px 0;
  text-align: left;
}
.hub-title {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 8px;
  color: #fff;
}
.hub-title span {
  background: var(--grad-signature);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hub-sub {
  font-size: 14.5px;
  color: var(--text-muted);
  max-width: 780px;
  line-height: 1.6;
}

.hub-gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
  margin-bottom: 36px;
}

.hub-card {
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-subtle);
  border-radius: 18px;
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease;
  cursor: pointer;
}
.hub-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; height: 3px;
  background: var(--border-strong);
  transition: background 0.25s ease;
}
.hub-card:hover {
  transform: translateY(-4px) scale(1.01);
  border-color: rgba(255, 255, 255, 0.22);
  box-shadow: 0 20px 48px rgba(0,0,0,0.7);
}
.hub-card:hover::before {
  background: var(--grad-signature);
}

.hub-card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 8px;
}
.hub-card-id {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-subtle);
  padding: 3px 8px;
  border-radius: 6px;
}
.hub-card-status {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 20px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.hub-card-status.ready {
  background: rgba(251, 176, 59, 0.12);
  color: var(--accent-yellow);
  border: 1px solid rgba(251, 176, 59, 0.3);
}
.hub-card-status.review {
  background: rgba(0, 210, 255, 0.12);
  color: var(--accent-cyan);
  border: 1px solid rgba(0, 210, 255, 0.3);
}
.hub-card-status.archived {
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-dim);
  border: 1px solid var(--border-subtle);
}
.status-indicator-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: currentColor;
}

.hub-card-icon {
  font-size: 34px;
  margin-bottom: 14px;
}
.hub-card-title {
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 10px;
  letter-spacing: -0.3px;
  line-height: 1.4;
}
.hub-card-desc {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.6;
  margin-bottom: 20px;
  flex-grow: 1;
}

.hub-card-specs-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.spec-pill {
  font-family: var(--font-mono);
  font-size: 10.5px;
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-subtle);
  color: var(--text-dim);
}
.spec-pill strong { color: var(--text-main); }

.hub-card-btn {
  background: transparent;
  border: 1.5px solid var(--border-strong);
  color: var(--accent-yellow);
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s ease;
  width: 100%;
}
.hub-card:hover .hub-card-btn {
  background: var(--accent-yellow);
  color: #050508;
  border-color: var(--accent-yellow);
}

/* ARCHIVE ACCORDION */
.archive-toggle-box {
  border-top: 1px dashed var(--border-subtle);
  padding-top: 24px;
  margin-top: 24px;
}
.archive-trigger-btn {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-subtle);
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s ease;
}
.archive-trigger-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
}
.archive-grid {
  display: none;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
  margin-top: 20px;
}
.archive-grid.open {
  display: grid;
}

/* ==========================================================================
   DOCUMENT VIEW STYLING (DETAIL BRIEF PENUH)
   ========================================================================== */
.hero-section {
  padding: 28px 0 24px 0;
  border-bottom: 1px solid var(--border-subtle);
  margin-bottom: 24px;
}
.doc-meta-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.hero-title {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.5px;
  line-height: 1.3;
  margin-bottom: 10px;
  color: #fff;
}
.hero-title span {
  background: var(--grad-signature);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero-lead {
  font-size: 14px;
  color: var(--text-muted);
  max-width: 960px;
  line-height: 1.65;
  margin-bottom: 24px;
}

.metrics-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
@media (max-width: 860px) {
  .metrics-strip { grid-template-columns: repeat(2, 1fr); }
}
.metric-box {
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 14px 16px;
  position: relative;
  overflow: hidden;
}
.metric-box::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
  background: var(--border-strong);
}
.metric-box.active::before {
  background: var(--grad-signature);
}
.metric-val {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 2px;
}
.metric-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* TABS NAVIGATION */
.tabs-wrapper {
  position: sticky;
  top: 56px;
  z-index: 90;
  background: rgba(8, 8, 10, 0.95);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-subtle);
  padding: 12px 0 8px 0;
  margin-bottom: 28px;
}
.tabs-nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
}
.tab-btn {
  background: transparent;
  border: 1px solid var(--border-subtle);
  color: var(--text-muted);
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  padding: 9px 18px;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.tab-btn:hover {
  color: #fff;
  border-color: var(--border-strong);
}
.tab-btn.active {
  background: var(--accent-yellow);
  color: #050508;
  border-color: var(--accent-yellow);
}

.tab-panel {
  display: none;
}
.tab-panel.active {
  display: block;
  animation: panelIn 0.25s ease-out;
}
@keyframes panelIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.panel-grid-2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
  margin-bottom: 24px;
}
@media (max-width: 768px) {
  .panel-grid-2 { grid-template-columns: 1fr; }
}

.spec-card {
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-subtle);
  border-radius: 16px;
  padding: 22px;
}
.spec-card-head {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--accent-yellow);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.spec-rows {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.spec-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.spec-key {
  font-size: 11px;
  color: var(--text-dim);
  font-family: var(--font-mono);
}
.spec-value {
  font-size: 13.5px;
  color: var(--text-main);
  font-weight: 600;
}

.bullet-checklist {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.bullet-checklist li {
  font-size: 13.5px;
  color: var(--text-main);
  display: flex;
  align-items: flex-start;
  gap: 10px;
  line-height: 1.5;
}
.bullet-checklist li::before {
  content: "✓";
  color: var(--accent-green);
  font-family: var(--font-mono);
  font-weight: 700;
}

.copy-showcase-box {
  background: rgba(14, 14, 20, 0.9);
  border: 1px solid var(--border-subtle);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
}
.headline-hero-text {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 800;
  color: #fff;
  padding-left: 14px;
  border-left: 3px solid var(--accent-yellow);
  margin-bottom: 16px;
  line-height: 1.4;
}
.caption-raw-box {
  background: rgba(0, 0, 0, 0.5);
  border: 1px dashed var(--border-subtle);
  border-radius: 10px;
  padding: 16px;
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.65;
  white-space: pre-wrap;
  font-family: var(--font-body);
  margin-top: 14px;
}

.prompt-callout {
  background: rgba(13, 124, 47, 0.08);
  border: 1px solid rgba(13, 124, 47, 0.25);
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 24px;
}
.prompt-code-wrap {
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  padding: 14px;
  font-family: var(--font-body);
  font-size: 12.5px;
  color: #dcfce7;
  line-height: 1.6;
  margin-top: 10px;
  word-break: break-word;
}

.image-preview-card {
  margin-top: 14px;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border-strong);
  background: rgba(0,0,0,0.4);
  text-align: center;
  padding: 10px;
}
.image-preview-card img {
  max-width: 100%;
  max-height: 280px;
  border-radius: 8px;
  object-fit: contain;
}

.doc-footer-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  padding: 24px 0 40px 0;
  border-top: 1px solid var(--border-subtle);
  margin-top: 32px;
  flex-wrap: wrap;
}
.action-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-subtle);
  color: var(--text-main);

<body>

<script>
const TARGET_HASH = "332b36f78ce7302c7812a23dfc67831229bc791c56f7b1836e2803da3b968e0f";
let allBriefs = [];

async function sha256(str) {
  const buf = new TextEncoder().encode(str);
  const hashBuf = await crypto.subtle.digest("SHA-256", buf);
  const hashArr = Array.from(new Uint8Array(hashBuf));
  return hashArr.map(b => b.toString(16).padStart(2, "0")).join("");
}

async function verifyGate() {
  const entered = document.getElementById("gate-pass").value.trim();
  const lower = entered.toLowerCase();
  const errBox = document.getElementById("gate-err");
  const hashLower = await sha256(lower);

  if (hashLower === TARGET_HASH) {
    sessionStorage.setItem("pmb_vault_auth", "granted");
    document.getElementById("security-gate").classList.add("unlocked");
    errBox.style.display = "none";
    loadBriefsData();
  } else {
    errBox.style.display = "block";
    const el = document.getElementById("gate-pass");
    el.value = "";
    el.focus();
  }
}

function handleGateKey(e) {
  if (e.key === "Enter") verifyGate();
}

function lockGate() {
  sessionStorage.removeItem("pmb_vault_auth");
  document.getElementById("security-gate").classList.remove("unlocked");
  document.getElementById("gate-pass").value = "";
  document.getElementById("gate-err").style.display = "none";
  returnToHub();
}

function checkSessionAuth() {
  if (sessionStorage.getItem("pmb_vault_auth") === "granted") {
    document.getElementById("security-gate").classList.add("unlocked");
    loadBriefsData();
  }
}

async function loadBriefsData() {
  try {
    const res = await fetch(`./briefs.json?t=${Date.now()}`);
    if (res.ok) {
      allBriefs = await res.json();
    } else {
      throw new Error("Failed to load JSON");
    }
  } catch (e) {
    console.warn("Using embedded fallback", e);
    allBriefs = [
      {
        id: "PMB-GRAF-202610-04",
        title: "Flyer Greeting Hari Sumpah Pemuda ke-98",
        category: "GRAFIS",
        status: "READY",
        statusLabel: "Siap Eksekusi",
        deadline: "Selasa, 27 Okt 2026 — 17:00 WIB",
        format: "Feed 4:5 (1080x1350px)",
        channel: "Instagram Feed & Story",
        funnel: "Kultural (TOFU)",

        palette: "Merah Berani (#D32F2F), Putih Bersih, Navy UMRI (#002B49), Aksen Gold (#FBB03B)",
        mood: "Heroik, khidmat, modern, sejuk Islami, penuh optimisme",
        mandatory: [
          "Logo resmi PMB UMRI & Akreditasi Unggul/Baik Sekali",
          "Logo Nasional Hari Sumpah Pemuda ke-98",
          "Subjek talent mahasiswa UMRI berbusana rapi, berhijab sopan",
          "Tagline: 'Sang Pencerah Muda'"
        ],
        headline: "Pemuda Hari Ini, Pemimpin Berkemajuan Esok Hari!",
        bullets: [
          "Selamat Hari Sumpah Pemuda ke-98 — 28 Oktober 2026.",
          "Kobarkan tekad, ukir karya nyata dari Bumi Lancang Kuning untuk Indonesia tercinta."
        ],
        cta: "Wujudkan Cita-Citamu di UMRI | pmb.umri.ac.id",
        caption: "Satu nusa, satu bangsa, satu bahasa: INDONESIA! 🇮🇩✨\n\nSelamat Hari Sumpah Pemuda ke-98!",
        aiPrompt: "Photorealistic group of diverse Indonesian college students standing proudly together, heroic lighting, 8k --ar 4:5",
        refLink: "https://id.pinterest.com/search/pins/?q=sumpah%20pemuda%20poster%20modern",
        driveLink: "https://drive.google.com"
      }
    ];
  }

  renderHubCards();
  renderDetailDocs();
}

function renderHubCards() {
  const activeGrid = document.getElementById("active-briefs-grid");
  const archiveGrid = document.getElementById("archived-briefs-grid");
  const archiveSection = document.getElementById("archive-section");

  activeGrid.innerHTML = "";
  archiveGrid.innerHTML = "";

  const activeList = allBriefs.filter(b => b.status !== "ARCHIVED");
  const archiveList = allBriefs.filter(b => b.status === "ARCHIVED");

  // Render Active Cards
  activeList.forEach(brief => {
    const icon = getCategoryIcon(brief.category);
    const cardEl = document.createElement("div");
    cardEl.className = "hub-card";
    cardEl.onclick = () => openDocument(`doc-${brief.id}`);

    cardEl.innerHTML = `
      <div class="hub-card-meta">
        <span class="hub-card-id">${brief.id}</span>
        <span class="hub-card-status ${brief.status === 'READY' ? 'ready' : 'review'}">
          <span class="status-indicator-dot"></span>
          <span>${brief.statusLabel || brief.status}</span>
        </span>
      </div>
      <div class="hub-card-icon">${icon}</div>
      <div class="hub-card-title">${brief.title}</div>
      <div class="hub-card-desc">${brief.headline || brief.objective}</div>
      <div class="hub-card-specs-row">
        <span class="spec-pill">Format: <strong>${brief.format}</strong></span>
        <span class="spec-pill">Funnel: <strong>${brief.funnel}</strong></span>
        <span class="spec-pill">Channel: <strong>${brief.channel}</strong></span>
      </div>
      <button class="hub-card-btn" onclick="event.stopPropagation(); openDocument('doc-${brief.id}');">
        <span>📑</span>
        <span>Buka Brief</span>
      </button>
    `;
    activeGrid.appendChild(cardEl);
  });

  // Render Archived Cards if any
  if (archiveList.length > 0) {
    archiveSection.style.display = "block";
    document.getElementById("archive-btn-text").textContent = `Tampilkan Arsip Brief (${archiveList.length} Disimpan)`;

    archiveList.forEach(brief => {
      const icon = getCategoryIcon(brief.category);
      const cardEl = document.createElement("div");
      cardEl.className = "hub-card";
      cardEl.style.opacity = "0.85";
      cardEl.onclick = () => openDocument(`doc-${brief.id}`);

      cardEl.innerHTML = `
        <div class="hub-card-meta">
          <span class="hub-card-id">${brief.id}</span>
          <span class="hub-card-status archived">Diarsipkan</span>
        </div>
        <div class="hub-card-icon">${icon}</div>
        <div class="hub-card-title">${brief.title}</div>
        <div class="hub-card-desc">${brief.headline || brief.objective}</div>
        <button class="hub-card-btn" onclick="event.stopPropagation(); openDocument('doc-${brief.id}');">
          <span>📑</span>
          <span>Buka Arsip</span>
        </button>
      `;
      archiveGrid.appendChild(cardEl);
    });
  } else {
    archiveSection.style.display = "none";
  }
}

          <h1 class="hero-title">
            ${brief.title}

          <p class="hero-lead">
            ${brief.objective}

              <div class="metric-label">Funnel Target</div>
            </div>
            <div class="metric-box">
              <div class="metric-val">${brief.channel.split(' ')[0] || brief.channel}</div>
              <div class="metric-label">Channel Utama</div>
            </div>

              <div class="metric-val">${brief.deadline.split('—')[0] || brief.deadline}</div>

            </div>
          </div>
        </div>

        <!-- TABS BAR -->
        <div class="tabs-wrapper">
          <div class="tabs-nav">
            <button class="tab-btn active" onclick="switchTab('tab-${brief.id}-spec', this)">📋 Spesifikasi</button>
            <button class="tab-btn" onclick="switchTab('tab-${brief.id}-visual', this)">🎨 Panduan Visual</button>
            <button class="tab-btn" onclick="switchTab('tab-${brief.id}-copy', this)">✍️ Copywriting</button>
            <button class="tab-btn" onclick="switchTab('tab-${brief.id}-ai', this)">🤖 Prompt AI &amp; Aset</button>
          </div>
        </div>

        <!-- TAB 1: SPESIFIKASI -->
        <div id="tab-${brief.id}-spec" class="tab-panel active">

                  <span class="spec-value">${brief.deadline}</span>
                </div>
              </div>
            </div>

            <div class="spec-card">
              <div class="spec-card-head">📌 Elemen Desain Wajib</div>

        </div>

        <!-- TAB 2: PANDUAN VISUAL -->

            </ul>

              CTA: ${brief.cta}
            </div>

            <div class="spec-card-head" style="margin-top: 24px;">📝 Draft Caption Media Sosial</div>
            <div class="caption-raw-box" id="caption-${brief.id}">${brief.caption}</div>
          </div>
        </div>

        <!-- TAB 4: PROMPT AI -->
        <div id="tab-${brief.id}-ai" class="tab-panel">
          <div class="prompt-callout">
            <div class="spec-card-head" style="color: #e2b4ff;">🤖 Rekomendasi Prompt AI Generator</div>
            <div class="prompt-code-wrap" id="prompt-${brief.id}">${brief.aiPrompt}</div>
          </div>
        </div>

        <!-- FOOTER ACTIONS -->
        <div class="doc-footer-actions">
          <button class="action-btn" onclick="copyText('prompt-${brief.id}', 'Prompt AI disalin!')">
            <span>🤖</span>
            <span>Salin Prompt</span>
          </button>
          <button class="action-btn" onclick="copyText('caption-${brief.id}', 'Caption disalin!')">
            <span>📝</span>
            <span>Salin Caption</span>
          </button>
          <button class="action-btn primary" onclick="copyFullBriefObject('${brief.id}')">
            <span>📋</span>
            <span>Salin Brief</span>
          </button>
        </div>
      </div>
    `;

    container.appendChild(docEl);
  });
}

function getCategoryIcon(cat) {
  if (cat === "GRAFIS") return "🎨";
  if (cat === "CAROUSEL") return "📱";
  if (cat === "REELS") return "🎬";
  if (cat === "AFTERMOVIE") return "🎥";
  return "📑";
}

function openDocument(docId) {
  document.querySelectorAll('.workspace-doc-view').forEach(v => v.classList.remove('active'));
  const target = document.getElementById(docId);
  if (target) {
    target.classList.add('active');
  }
  const backBtn = document.getElementById('header-back-btn');
  if (backBtn) {
    backBtn.style.display = (docId === 'doc-hub') ? 'none' : 'inline-flex';
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function returnToHub() {
  openDocument('doc-hub');
}

function switchTab(tabId, btnEl) {
  const scope = btnEl ? (btnEl.closest('.workspace-doc-view') || document) : document;
  scope.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  scope.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

  const activeP = document.getElementById(tabId);
  if (activeP) activeP.classList.add('active');
  if (btnEl) btnEl.classList.add('active');
}

function toggleArchive() {
  const container = document.getElementById("archived-briefs-grid");
  const btnText = document.getElementById("archive-btn-text");
  container.classList.toggle("open");
  if (container.classList.contains("open")) {
    btnText.textContent = "Sembunyikan Arsip Brief";
  } else {
    btnText.textContent = `Tampilkan Arsip Brief (${allBriefs.filter(b=>b.status==='ARCHIVED').length} Disimpan)`;
  }
}

function showToast(msg) {
  const container = document.getElementById("toast-container");
  const el = document.createElement("div");
  el.className = "toast-msg";
  el.innerHTML = `<span>✨</span> <span>${msg}</span>`;
  container.appendChild(el);

  setTimeout(() => {
    el.style.opacity = "0";
    el.style.transform = "translateY(10px)";
    el.style.transition = "all 0.25s ease";
    setTimeout(() => el.remove(), 250);
  }, 2200);
}

function copyText(elementId, toastMsg) {
  const el = document.getElementById(elementId);
  if (!el) return;
  const text = el.innerText || el.textContent;
  navigator.clipboard.writeText(text).then(() => {
    showToast(toastMsg || "Berhasil disalin!");
  });
}

function copyFullBriefObject(id) {
  const brief = allBriefs.find(b => b.id === id);
  if (!brief) return;

  const text = `=== PMB UMRI PRODUCTION BRIEF ===
JUDUL: ${brief.title}
ID: ${brief.id} | Status: ${brief.statusLabel || brief.status}
Format: ${brief.format} | Deadline: ${brief.deadline}
Channel: ${brief.channel} | Funnel: ${brief.funnel}

HEADLINE: "${brief.headline}"
POIN PESAN:
${(brief.bullets || []).map(b => "  - " + b).join("\n")}
CTA: ${brief.cta}

DRAFT CAPTION:
${brief.caption}

PROMPT AI:
${brief.aiPrompt}
=================================`;

  navigator.clipboard.writeText(text).then(() => {
    showToast("Brief lengkap berhasil disalin!");
  });
}

checkSessionAuth();
</script>
