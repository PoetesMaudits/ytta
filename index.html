<style>
:root {
  --bg-deep: #08080a;
  --bg-card: #0e0e13;
  --border-subtle: #1e1e28;
  --border-strong: #333344;
  --text-main: #f5f5f7;
  --text-muted: #888899;
  --accent-yellow: #F5E03A;
  --accent-pink: #F0527A;
  --accent-purple: #8B2FC2;
  --grad-signature: linear-gradient(90deg, #F5E03A 0%, #F0527A 50%, #8B2FC2 100%);
  --font-display: 'Creato Display', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background-color: var(--bg-deep);
  color: var(--text-main);
  font-family: var(--font-display);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: 
    linear-gradient(to right, rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 36px 36px;
  pointer-events: none;
}

.portal-box {
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  max-width: 480px;
  width: 100%;
  padding: 44px 36px;
  text-align: center;
  box-shadow: 0 30px 80px rgba(0,0,0,0.9);
  position: relative;
  z-index: 1;
}
.portal-box::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--grad-signature);
}

.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent-yellow);
  background: rgba(245, 224, 58, 0.08);
  border: 1px solid rgba(245, 224, 58, 0.25);
  padding: 4px 12px;
  border-radius: 3px;
  margin-bottom: 20px;
  letter-spacing: 1px;
}

.portal-title {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -1px;
  margin-bottom: 8px;
}
.portal-title span {
  background: var(--grad-signature);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.portal-desc {
  font-size: 13.5px;
  color: var(--text-muted);
  line-height: 1.6;
  margin-bottom: 28px;
}

.input-group {
  margin-bottom: 16px;
}
.vault-input {
  width: 100%;
  background: #08080b;
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  color: #fff;
  font-family: var(--font-mono);
  font-size: 16px;
  text-align: center;
  padding: 14px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  letter-spacing: 2px;
}
.vault-input:focus {
  border-color: var(--accent-yellow);
  box-shadow: 0 0 16px rgba(245, 224, 58, 0.25);
}

.vault-btn {
  width: 100%;
  background: var(--grad-signature);
  color: #000;
  font-weight: 800;
  font-size: 14px;
  border: none;
  padding: 14px;
  border-radius: 4px;
  cursor: pointer;
  font-family: var(--font-display);
  letter-spacing: 0.5px;
  transition: transform 0.2s, box-shadow 0.2s;
}
.vault-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(245, 224, 58, 0.3);
}

.vault-error {
  display: none;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: #ff5252;
  margin-top: 12px;
}

.portal-quote {
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid var(--border-subtle);
  font-family: var(--font-mono);
  font-size: 11px;
  color: #555566;
  font-style: italic;
}
</style>
</head>

  <h1 class="portal-title">YTTA <span>SYSTEM</span></h1>

<script>
// VAULT ROUTING TABLE (HASH-PROTECTED)
const HASHED_ROUTES = {
  // MantapKali & mantapkali
  "84e41149998523aa38383223198cadc2d45b15a0d066b7edbece63afaf588229": "./utary/",
  "8db2e41ba3e1df839256608708bf01a0bfd727de7d4d463f1eae486c8e573c1f": "./utary/",
  // Legacy / fallback PINs
  "c2d735ed61274b73ed20a49594661e35185797b6ee082cb5145383e548d4f9d0": "./utary/",
  "27a301fdbc4d398d2bb271d90ba609ed26165584f08cf6b07b0b98f333bf46ea": "./utary/",
  "4aa0b06ef5d367d890fc03a1963d61a60fedcadbf0f50a28fd6456597afcbd1f": "./utary/"
};

// Auto-redirect if already authenticated in this session
if (sessionStorage.getItem("utary_auth") === "granted") {
  window.location.href = "./utary/";
}

async function sha256(str) {
  const buf = new TextEncoder().encode(str);
  const hashBuf = await crypto.subtle.digest("SHA-256", buf);
  const hashArr = Array.from(new Uint8Array(hashBuf));
  return hashArr.map(b => b.toString(16).padStart(2, "0")).join("");
}

async function unlockPortal() {
  const rawKey = document.getElementById("vault-key").value.trim();
  const lowerKey = rawKey.toLowerCase();
  const err = document.getElementById("vault-err");
  const hashedRaw = await sha256(rawKey);
  const hashedLower = await sha256(lowerKey);
  
  const dest = HASHED_ROUTES[hashedRaw] || HASHED_ROUTES[hashedLower];
  if (dest) {
    sessionStorage.setItem("utary_auth", "granted");
    window.location.href = dest;
  } else {
    err.style.display = "block";
    document.getElementById("vault-key").value = "";
    document.getElementById("vault-key").focus();
  }
}

function handleKey(e) {
  if (e.key === "Enter") {
    unlockPortal();
  }
}
</script>
